name: Publish VulkanGames site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: vulkangames-site-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout VulkanGames
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test site pages
        run: |
          node --test
          node - <<'NODE'
          const fs = require('node:fs');
          const vm = require('node:vm');
          for (const path of ['index.html', 'emulators/index.html', 'emulators/settings.html']) {
            const html = fs.readFileSync(path, 'utf8');
            const scripts = [...html.matchAll(/<script>([\s\S]*?)<\/script>/g)];
            for (const script of scripts) new vm.Script(script[1], {filename:path});
            console.log('Parsed', path);
          }
          NODE

      - name: Stage TabStationToo PS2 emulator
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          git clone --depth 1 --filter=blob:none --sparse --branch wasm https://github.com/TabStationToo/TabStationToo.git "$tmp/source"
          git -C "$tmp/source" sparse-checkout set pcsx2-wasm/web COPYING.GPLv3 bin/docs/ThirdPartyLicenses.html
          rm -rf emulators/ps2
          mkdir -p emulators/ps2/docs
          cp -a "$tmp/source/pcsx2-wasm/web/." emulators/ps2/
          cp "$tmp/source/COPYING.GPLv3" emulators/ps2/COPYING.GPLv3
          cp "$tmp/source/bin/docs/ThirdPartyLicenses.html" emulators/ps2/docs/ThirdPartyLicenses.html
          for asset in pcsx2-wasm.js pcsx2-wasm.wasm pcsx2-wasm.data; do
            curl --fail --location --retry 5 --retry-all-errors --retry-delay 3 \
              --connect-timeout 20 --max-time 1200 \
              "https://tabstationtoo.github.io/TabStationToo/$asset" \
              --output "emulators/ps2/$asset"
            test -s "emulators/ps2/$asset"
          done
          cp emulators/ps2/isolation.js emulators/isolation.js
          cp emulators/ps2/coi-serviceworker.js emulators/coi-serviceworker.js
          {
            echo "Upstream project: https://github.com/TabStationToo/TabStationToo"
            echo "Source branch: wasm"
            echo "Source commit: $(git -C "$tmp/source" rev-parse HEAD)"
            echo "License: GNU GPL-3.0"
            echo "WebAssembly assets: https://tabstationtoo.github.io/TabStationToo/"
          } > emulators/ps2/UPSTREAM-SOURCE.txt
          du -sh emulators/ps2

      - name: Publish GitHub Pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: \${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: .
          force_orphan: false
          enable_jekyll: false
          exclude_assets: ".github"
