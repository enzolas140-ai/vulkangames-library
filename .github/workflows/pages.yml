name: Deploy VulkanGames and build ARM64 runtime
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: vulkangames-arm64-build
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout VulkanGames
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run emulator integration smoke tests
        run: |
          node --test
          sed -n '/<script type="module">/,/<\/script>/p' arm64.html | sed '1d;$d' > /tmp/arm64-launcher.mjs
          node --check /tmp/arm64-launcher.mjs

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build meson pkg-config             python3 python3-mako python3-yaml python3-packaging python3-setuptools             bison flex zstd libtool autoconf automake gettext wget curl             libffi-dev zlib1g-dev libexpat1-dev libfontconfig1-dev libfreetype6-dev             libx11-dev libxext-dev libxfixes-dev libxdamage-dev libxrandr-dev             libxrender-dev libxi-dev libxkbfile-dev libxkbcommon-dev libxkbcommon-x11-dev             libxfont-dev libxshmfence-dev libxss-dev libxtst-dev             libxcb1-dev libxcb-xfixes0-dev libxcb-shape0-dev libxcb-randr0-dev             libxcb-render0-dev libxcb-render-util0-dev libxcb-xkb-dev libxcb-icccm4-dev             libwayland-dev wayland-protocols libpixman-1-dev libdrm-dev libgbm-dev             libegl1-mesa-dev libgles2-mesa-dev libvulkan-dev xkb-data x11-xkb-utils             gcc-aarch64-linux-gnu

      - name: Install LLVM 22
        run: |
          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 22
          sudo apt-get install -y clang-22 lld-22 llvm-22 llvm-22-dev
          echo "/usr/lib/llvm-22/bin" >> "$GITHUB_PATH"
          echo "LLVM_CONFIG=/usr/lib/llvm-22/bin/llvm-config" >> "$GITHUB_ENV"

      - name: Setup Rust for GEX
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.0
          targets: wasm32-unknown-unknown

      - name: Install Rust source for GEX kernel build
        run: rustup component add rust-src --toolchain nightly

      - name: Install Rust documentation for bundled license notices
        run: rustup component add rust-docs

      - name: Setup Emscripten 6.0.1
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$HOME/emsdk"
          "$HOME/emsdk/emsdk" install 6.0.1
          "$HOME/emsdk/emsdk" activate 6.0.1
          echo "EMSDK=$HOME/emsdk" >> "$GITHUB_ENV"
          echo "$HOME/emsdk/upstream/emscripten" >> "$GITHUB_PATH"
          echo "$HOME/emsdk/upstream/bin" >> "$GITHUB_PATH"

      - name: Checkout pinned GEX runtime
        run: |
          git clone --no-checkout https://github.com/BrowserPorts/stellite-gex.git /tmp/stellite-gex
          git -C /tmp/stellite-gex checkout --detach 95fb079c93bb1e46835e5fa6d807db5d01dd1491
          git -C /tmp/stellite-gex submodule update --init --recursive

      - name: Install and verify pinned nightly kernel toolchain
        run: |
          set -euxo pipefail
          rustup toolchain install nightly --profile minimal --component rust-src
          rustup component add rust-src --toolchain nightly
          rustc +nightly --version --verbose
          cargo +nightly --version
          RUST_SRC="$(rustc +nightly --print sysroot)/lib/rustlib/src/rust/library"
          test -d "$RUST_SRC"

      - name: Cache GEX toolchains and build outputs
        uses: actions/cache@v4
        with:
          path: |
            /home/runner/.cache/gex
            /tmp/stellite-gex/target
            /tmp/stellite-gex/runtime/node_modules
          key: gex-arm64-v2-${{ runner.os }}-${{ hashFiles('arm64-runtime.lock') }}
          restore-keys: |
            gex-arm64-${{ runner.os }}-

      - name: Preload pinned musl toolchains from GitHub mirror
        shell: bash
        run: |
          set -euo pipefail
          DL_DIR="$HOME/.cache/gex/dl"
          mkdir -p "$DL_DIR"

          fetch_pinned() {
            local name="$1"
            local url="$2"
            local sha="$3"
            local dest="$DL_DIR/$name"

            if [ -s "$dest" ] && echo "$sha  $dest" | sha256sum -c --status; then
              echo "Using cached, verified $name"
              return
            fi

            rm -f "$dest" "$dest.tmp"
            echo "Downloading verified mirror asset: $name"
            curl --fail --location --retry 5 --retry-all-errors \
              --retry-delay 3 --connect-timeout 20 --max-time 900 \
              --output "$dest.tmp" "$url"
            echo "$sha  $dest.tmp" | sha256sum -c -
            mv "$dest.tmp" "$dest"
          }

          # These GitHub Release assets are the musl.cc mirror; hashes match
          # the pinned values in stellite-gex/toolchain/pins.
          fetch_pinned "aarch64-linux-musl-cross.tgz" \
            "https://github.com/musl-cc/musl.cc/releases/download/v0.0.1/aarch64-linux-musl-cross.tgz" \
            "c909817856d6ceda86aa510894fa3527eac7989f0ef6e87b5721c58737a06c38"
          fetch_pinned "x86_64-linux-musl-cross.tgz" \
            "https://github.com/musl-cc/musl.cc/releases/download/v0.0.1/x86_64-linux-musl-cross.tgz" \
            "c5d410d9f82a4f24c549fe5d24f988f85b2679b452413a9f7e5f7b956f2fe7ea"

      - name: Build GEX kernel first with full diagnostics
        shell: bash
        run: |
          set -euxo pipefail
          cd /tmp/stellite-gex
          rm -rf target/shared-kernel
          mkdir -p runtime/files/out/gex
          CARGO_TERM_COLOR=never RUST_BACKTRACE=1 sh -x hosts/kernel/build.sh

      - name: Build GEX single-thread browser runtime
        run: |
          cd /tmp/stellite-gex
          make page-sp JOBS=2 PAGE_FLAGS=--debug

      - name: Package the ARM64 runtime for GitHub Pages
        run: |
          set -euxo pipefail
          cd /tmp/stellite-gex
          mkdir -p "$GITHUB_WORKSPACE/arm64/runtime" "$GITHUB_WORKSPACE/arm64/rootfs" "$GITHUB_WORKSPACE/arm64/guestfs/glibc"
          GEX_KEEP_NAMES=1 ./runtime/build.sh --single "$GITHUB_WORKSPACE/arm64/runtime"
          test -s runtime/files/out/rootfs/busybox.tar
          test -s runtime/files/out/fs/libEGL.so.1
          test -s runtime/files/out/fs/libGLESv2.so.2
          cp runtime/files/out/rootfs/busybox.tar "$GITHUB_WORKSPACE/arm64/rootfs/busybox.tar"
          cp runtime/files/out/fs/libEGL.so.1 runtime/files/out/fs/libGLESv2.so.2 "$GITHUB_WORKSPACE/arm64/guestfs/"
          if [ -d runtime/files/out/fs/glibc ]; then
            for f in libEGL.so.1 libGLESv2.so.2 libGL.so.1; do
              if [ -f "runtime/files/out/fs/glibc/$f" ]; then cp "runtime/files/out/fs/glibc/$f" "$GITHUB_WORKSPACE/arm64/guestfs/glibc/"; fi
            done
          fi
          printf 'GEX source: https://github.com/BrowserPorts/stellite-gex/tree/95fb079c93bb1e46835e5fa6d807db5d01dd1491\nCommit: 95fb079c93bb1e46835e5fa6d807db5d01dd1491\nLicense: AGPL-3.0-only\n' > "$GITHUB_WORKSPACE/arm64/runtime/SOURCE.txt"
          du -sh "$GITHUB_WORKSPACE/arm64"

      - name: Build minimal AArch64 glibc and SDL2 libraries
        run: |
          set -euxo pipefail
          sudo dpkg --add-architecture arm64
          . /etc/os-release
          echo "deb [arch=arm64 signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] http://ports.ubuntu.com/ubuntu-ports ${VERSION_CODENAME} main universe" | sudo tee /etc/apt/sources.list.d/arm64-ports.list
          sudo apt-get update
          DEB_DIR="$RUNNER_TEMP/arm64-debs"
          ROOTFS_DIR="$RUNNER_TEMP/arm64-rootfs"
          sudo mkdir -p "$DEB_DIR/partial" "$ROOTFS_DIR"
          sudo apt-get install -y --download-only --no-install-recommends \
            -o Dir::Cache::archives="$DEB_DIR/" \
            libsdl2-2.0-0:arm64 libfreetype6:arm64 zlib1g:arm64
          for deb in "$DEB_DIR"/*.deb; do
            [ -f "$deb" ] || continue
            sudo dpkg-deb -x "$deb" "$ROOTFS_DIR"
          done
          test -e "$ROOTFS_DIR/lib/ld-linux-aarch64.so.1"
          test -e "$ROOTFS_DIR/usr/lib/aarch64-linux-gnu/libSDL2-2.0.so.0"
          sudo tar -C "$ROOTFS_DIR" -cf "$GITHUB_WORKSPACE/arm64/rootfs/glibc-runtime.tar" .
          ls -lh "$GITHUB_WORKSPACE/arm64/rootfs/glibc-runtime.tar"

      - name: Publish site to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: .
          force_orphan: false
          enable_jekyll: false
          exclude_assets: ".github"
